name: Voxa Android Release - ARM64 ONLY

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build Voxa ARM64 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h

      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Configure ARM64-only native build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Configure application module
          app_path = Path("TMessagesProj_App/build.gradle")

          if not app_path.exists():
              raise SystemExit("Application build.gradle not found")

          app = app_path.read_text(encoding="utf-8")

          app, app_count = re.subn(
              r'(?m)^(\s*)abiFilters\s+.*$',
              r'\1abiFilters "arm64-v8a"',
              app
          )
          if app_count == 0:
              raise SystemExit("No ABI filters found in application module")

          app_path.write_text(app, encoding="utf-8")

          # Configure native module
          native_path = Path("TMessagesProj/build.gradle")

          if not native_path.exists():
              raise SystemExit("Native module build.gradle not found")

          native = native_path.read_text(encoding="utf-8")
          native, native_count = re.subn(
              r'(?m)^(\s*)abiFilters\s+.*$',
              r'\1abiFilters "arm64-v8a"',
              native
          )

          if native_count == 0:
              marker = "    defaultConfig {\n"

              if marker not in native:
                  raise SystemExit("Native defaultConfig block not found")
              native = native.replace(
                  marker,
                  marker +
                  '        ndk {\n'
                  '            abiFilters "arm64-v8a"\n'
                  '        }\n',
                  1
              )

          native_path.write_text(native, encoding="utf-8")

          # Verify configuration
          print("Application ABI configuration:")
          for line in app.splitlines():
              if "abiFilters" in line:
                  print(line.strip())
                  if "arm64-v8a" not in line:
                      raise SystemExit("Unexpected application ABI")

          print("Native module ABI configuration:")
          for line in native.splitlines():
              if "abiFilters" in line:
                  print(line.strip())
                  if "arm64-v8a" not in line:
                      raise SystemExit("Unexpected native ABI")

          print("ARM64 configuration completed.")
          PY

      - name: Build Voxa ARM64 Release APK
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          # Record build start time to avoid selecting an old APK
          echo "BUILD_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.testOnly=false \
            -Pandroid.injected.build.abi=arm64-v8a \
            :TMessagesProj_App:assembleAfatRelease

      - name: Search entire project for generated APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Searching the ENTIRE repository for APK"
          echo "========================================"

          echo "Build started at: $BUILD_START_EPOCH"

          # Search every directory in the repository.
          # Only accept APKs created or modified during this build.
          APK="$(find . \
            -type f \
            -iname "*.apk" \
            -not -path "./.git/*" \
            -newermt "@${BUILD_START_EPOCH}" \
            -size +0c \
            -print0 |
            xargs -0 -r ls -t 2>/dev/null |
            head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "::error::No newly generated APK was found anywhere in the repository."

            echo ""
            echo "========== ALL APK FILES =========="
            find . \
              -type f \
              -iname "*.apk" \
              -not -path "./.git/*" \
              -print || true

            echo ""
            echo "========== OUTPUT METADATA =========="
            find . \
              -type f \
              -name "output-metadata.json" \
              -not -path "./.git/*" \
              -print || true

            echo ""
            echo "========== BUILD OUTPUT DIRECTORIES =========="
            find . \
              -type d \
              \( -name "outputs" -o -name "apk" \) \
              -not -path "./.git/*" \
              -print || true

            echo ""
            echo "========== GRADLE BUILD FILES =========="
            find . \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -not -path "./.git/*" \
              -print || true

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          echo ""
          echo "========== APK SIZE =========="
          ls -lh "$APK"

          echo ""
          echo "========== APK INTEGRITY =========="
          unzip -t "$APK" > /dev/null
          echo "APK integrity: OK"

          echo ""
          echo "========== TEST-ONLY CHECK =========="
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          if [ ! -x "$AAPT" ]; then
            echo "::error::aapt was not found at: $AAPT"
            exit 1
          fi

          MANIFEST_DUMP="$(mktemp)"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$MANIFEST_DUMP"

          if grep -Eiq 'android:testOnly.*(=true|0xffffffff)' "$MANIFEST_DUMP"; then
            echo "::error::The generated APK contains android:testOnly=true."
            grep -Ein 'android:testOnly' "$MANIFEST_DUMP" || true
            rm -f "$MANIFEST_DUMP"
            exit 1
          fi

          if grep -Eiq 'android:testOnly' "$MANIFEST_DUMP"; then
            echo "android:testOnly is present but is not true:"
            grep -Ein 'android:testOnly' "$MANIFEST_DUMP" || true
          else
            echo "android:testOnly is absent; Android default is false."
          fi

          rm -f "$MANIFEST_DUMP"
          echo "TEST-ONLY CHECK: OK"

          echo ""
          echo "========== NATIVE ABI CHECK =========="

          mapfile -t ABIS < <(
            unzip -Z1 "$APK" |
            awk -F/ '$1 == "lib" && NF >= 3 {print $2}' |
            sort -u
          )

          if [ "${#ABIS[@]}" -eq 0 ]; then
            echo "::error::No native libraries found inside APK."
            exit 1
          fi

          printf '%s\n' "${ABIS[@]}"

          if ! printf '%s\n' "${ABIS[@]}" | grep -Fxq "arm64-v8a"; then
            echo "::error::ARM64 native libraries not found."
            exit 1
          fi

          for ABI in "${ABIS[@]}"; do
            if [ "$ABI" != "arm64-v8a" ]; then
              echo "::error::Unexpected architecture found: $ABI"
              exit 1
            fi
          done

          echo ""
          echo "========== SHA256 =========="
          sha256sum "$APK"

          # Export exact APK path for artifact upload
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

          echo ""
          echo "APK search and verification completed successfully."

      - name: Upload Voxa ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: voxa-release-apk-arm64
          path: ${{ steps.verify_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
