
name: Voxa Android Release - ARM64 ONLY

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build Voxa 64-bit Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # Free disk space
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h

      # Checkout source
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Install build dependencies
      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      # Force ARM64 in both Gradle modules
      - name: Configure ARM64-only native build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Application module
          app_path = Path("TMessagesProj_App/build.gradle")

          if not app_path.exists():
              raise SystemExit("Application build.gradle not found")

          app = app_path.read_text(encoding="utf-8")

          app, app_count = re.subn(
              r'(?m)^(\s*)abiFilters\s+.*$',
              r'\1abiFilters "arm64-v8a"',
              app
          )

          if app_count == 0:
              raise SystemExit("No ABI filters found in application module")

          app_path.write_text(app, encoding="utf-8")

          # Native library module
          native_path = Path("TMessagesProj/build.gradle")

          if not native_path.exists():
              raise SystemExit("Native module build.gradle not found")

          native = native_path.read_text(encoding="utf-8")

          native, native_count = re.subn(
              r'(?m)^(\s*)abiFilters\s+.*$',
              r'\1abiFilters "arm64-v8a"',
              native
          )

          if native_count == 0:
              marker = "    defaultConfig {\n"

              if marker not in native:
                  raise SystemExit("Native defaultConfig block not found")

              native = native.replace(
                  marker,
                  marker +
                  '        ndk {\n'
                  '            abiFilters "arm64-v8a"\n'
                  '        }\n',
                  1
              )

          native_path.write_text(native, encoding="utf-8")

          # Verify configuration
          print("Application ABI filters:")
          for line in app.splitlines():
              if "abiFilters" in line:
                  print(line.strip())
                  if "arm64-v8a" not in line:
                      raise SystemExit("Unexpected application ABI")

          print("Native module ABI filters:")
          for line in native.splitlines():
              if "abiFilters" in line:
                  print(line.strip())
                  if "arm64-v8a" not in line:
                      raise SystemExit("Unexpected native ABI")

          print("ARM64-only configuration completed.")
          PY

      # Build Release APK
      - name: Build signed ARM64 Release APK
        shell: bash
        run: |
          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.build.abi=arm64-v8a \
            :TMessagesProj_App:assembleAfatRelease

      # Locate APK and verify architecture
      - name: Locate and verify ARM64 APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for APK files..."

          APK="$(find TMessagesProj_App/build \
            -type f \
            -path "*/outputs/apk/*" \
            -name "*.apk" \
            -size +0c \
            -print | sort | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "::error::No APK file found."

            echo "Available build outputs:"
            find TMessagesProj_App/build/outputs \
              -type f -print || true

            exit 1
          fi

          echo "APK found: $APK"

          # Verify APK integrity
          unzip -t "$APK" > /dev/null
          echo "APK integrity: OK"

          # Extract native ABIs
          mapfile -t ABIS < <(
            unzip -Z1 "$APK" |
            awk -F/ '$1 == "lib" && NF >= 3 {print $2}' |
            sort -u
          )

          echo "Native ABIs inside APK:"
          printf '%s\n' "${ABIS[@]}"

          # Require ARM64
          if ! printf '%s\n' "${ABIS[@]}" | grep -Fxq "arm64-v8a"; then
            echo "::error::ARM64 native libraries not found."
            exit 1
          fi

          # Reject every other ABI
          for ABI in "${ABIS[@]}"; do
            if [ "$ABI" != "arm64-v8a" ]; then
              echo "::error::Unexpected ABI: $ABI"
              exit 1
            fi
          done

          # Checksum
          sha256sum "$APK"

          # Export APK location
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

          echo "ARM64 APK verification successful."

      # Upload APK
      - name: Upload Voxa ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: voxa-release-apk-arm64
          path: ${{ steps.verify_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
