name: Voxa Android Release (arm64)

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build Voxa Release APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h

      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK, NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Restrict build to arm64-v8a only
        run: |
          sed -i 's/abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"/abiFilters "arm64-v8a"/' TMessagesProj_App/build.gradle
          grep -n "abiFilters" TMessagesProj_App/build.gradle

      - name: Build signed Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace -Pandroid.injected.build.abi=arm64-v8a :TMessagesProj_App:assembleAfatRelease

      - name: Verify APK output
        run: |
          APK="TMessagesProj_App/build/outputs/apk/afat/release/app.apk"
          test -s "$APK"
          sha256sum "$APK"
          echo "Native libs inside APK:"
          unzip -l "$APK" | grep "lib/" | awk '{print $4}' | cut -d/ -f1,2 | sort | uniq -c

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: voxa-release-apk-arm64
          path: TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          if-no-files-found: error
          retention-days: 30
